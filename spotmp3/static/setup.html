<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a0a0b" />
  <meta name="robots" content="noindex" />
  <title>Set up · SpotMP3</title>
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body class="centered">
  <main class="card auth-card">
    <img class="icon" src="/static/icon.svg" alt="" width="56" height="56" />
    <h1><span class="accent">Spot</span>MP3</h1>
    <p class="sub">Welcome. Create the first account: it becomes the admin and can add accounts for other people.</p>
    <form id="setup" novalidate>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="username" required autofocus />
      <label for="password">Password (at least 10 characters)</label>
      <input id="password" name="password" type="password" autocomplete="new-password" minlength="10" required />
      <label for="confirm">Password again</label>
      <input id="confirm" name="confirm" type="password" autocomplete="new-password" minlength="10" required />
      <p class="error" id="error" role="alert" hidden></p>
      <button id="submit" type="submit">Create account</button>
    </form>
  </main>
  <script src="/static/auth.js"></script>
</body>
</html>
