<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#19191c" />
  <meta name="robots" content="noindex" />
  <title>Sign in · SpotMP3</title>
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/static/app.css?v=20261112" />
</head>
<body class="centered">
  <main class="card auth-card">
    <img class="icon" src="/static/icon.svg" alt="" width="56" height="56" />
    <h1><span class="accent">Spot</span>MP3</h1>
    <p class="sub">Sign in to turn Spotify and YouTube links into MP3s.</p>
    <form id="signin" novalidate>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="username" required autofocus />
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />
      <p class="error" id="error" role="alert" hidden></p>
      <button id="submit" type="submit">Sign in</button>
    </form>
  </main>
  <script src="/static/auth.js"></script>
</body>
</html>
